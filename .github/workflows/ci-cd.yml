name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: blog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check database migrations
        env:
          TURSO_DATABASE_URL: file:ci.db
          TURSO_AUTH_TOKEN: ci-local-only-token
        run: pnpm db:check

      - name: Prepare test database
        env:
          TURSO_DATABASE_URL: file:ci.db
          TURSO_AUTH_TOKEN: ci-local-only-token
        run: pnpm db:migrate

      - name: Test
        env:
          TURSO_DATABASE_URL: file:ci.db
          TURSO_AUTH_TOKEN: ci-local-only-token
        run: pnpm test

      - name: Build
        env:
          BETTER_AUTH_URL: http://localhost:4400
          BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-0123456789
          TURSO_DATABASE_URL: file:ci.db
          TURSO_AUTH_TOKEN: ci-local-only-token
        run: pnpm build

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: Deployment
    steps:
      - name: Prepare SSH files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/xdd-blog-ssh"
          install -d -m 700 "$ssh_dir"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          printf 'SSH_KEY_PATH=%s/id_ed25519\n' "$ssh_dir" >> "$GITHUB_ENV"
          printf 'KNOWN_HOSTS_PATH=%s/known_hosts\n' "$ssh_dir" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRIEND_APPLY_NOTIFY_EMAIL: ${{ vars.FRIEND_APPLY_NOTIFY_EMAIL || secrets.FRIEND_APPLY_NOTIFY_EMAIL }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL || secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID || secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID || secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          AI_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.AI_CREDENTIAL_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          ssh_args=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH"
            -i "$SSH_KEY_PATH"
            -p "$DEPLOY_PORT"
          )

          (
            printf 'export TARGET_SHA=%q\n' "$TARGET_SHA"
            node -e '
              const vars = {
                RESEND_API_KEY: process.env.RESEND_API_KEY || "",
                FRIEND_APPLY_NOTIFY_EMAIL: process.env.FRIEND_APPLY_NOTIFY_EMAIL || "",
                RESEND_FROM_EMAIL: process.env.RESEND_FROM_EMAIL || "",
                TURSO_DATABASE_URL: process.env.TURSO_DATABASE_URL || "",
                TURSO_AUTH_TOKEN: process.env.TURSO_AUTH_TOKEN || "",
                BETTER_AUTH_URL: process.env.BETTER_AUTH_URL || "",
                BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET || "",
                OAUTH_GITHUB_CLIENT_ID: process.env.OAUTH_GITHUB_CLIENT_ID || "",
                OAUTH_GITHUB_CLIENT_SECRET: process.env.OAUTH_GITHUB_CLIENT_SECRET || "",
                OAUTH_GOOGLE_CLIENT_ID: process.env.OAUTH_GOOGLE_CLIENT_ID || "",
                OAUTH_GOOGLE_CLIENT_SECRET: process.env.OAUTH_GOOGLE_CLIENT_SECRET || "",
                ADMIN_EMAIL: process.env.ADMIN_EMAIL || "",
                AI_CREDENTIAL_ENCRYPTION_KEY: process.env.AI_CREDENTIAL_ENCRYPTION_KEY || ""
              };
              process.stdout.write("export ENV_JSON_B64=" + Buffer.from(JSON.stringify(vars)).toString("base64") + "\n");
            '
            cat <<'REMOTE'
          set -euo pipefail
          target_sha="${TARGET_SHA:?missing target SHA}"
          app_dir=/home/deploy/code/xdd/blog

          cd "$app_dir"
          echo "Checking the server worktree"
          if [[ -f pnpm-workspace.yaml ]] && ! git ls-files --error-unmatch -- pnpm-workspace.yaml >/dev/null 2>&1; then
            echo "Cleaning up legacy untracked pnpm-workspace.yaml before merge"
            rm -f pnpm-workspace.yaml
          fi

          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$worktree_status" ]]; then
            echo "The server worktree has unexpected uncommitted or untracked changes; deployment stopped." >&2
            git status --short --branch >&2
            exit 1
          fi

          if [[ ! -f .env.local ]] ||
            ! git check-ignore -q -- .env.local ||
            git ls-files --error-unmatch -- .env.local >/dev/null 2>&1; then
            echo "Missing or tracked $app_dir/.env.local; deployment stopped without restarting the service." >&2
            exit 1
          fi

          echo "Fetching origin/main"
          git switch main
          git fetch --prune origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$target_sha" ]]; then
            echo "origin/main ($remote_sha) does not match the workflow commit ($target_sha); deployment stopped." >&2
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$current_sha" "$remote_sha"; then
            echo "The server main ($current_sha) is not an ancestor of origin/main ($remote_sha); deployment stopped." >&2
            exit 1
          fi

          echo "Fast-forwarding the server worktree"
          git merge --ff-only origin/main

          source /home/deploy/.nvm/nvm.sh
          nvm use 24.16.0 >/dev/null

          echo "Syncing optional environment variables into .env.local"
          node -e '
            const fs = require("node:fs");
            const raw = process.env.ENV_JSON_B64 || "";
            if (!raw) process.exit(0);
            const payload = JSON.parse(Buffer.from(raw, "base64").toString("utf8"));
            let content = fs.existsSync(".env.local") ? fs.readFileSync(".env.local", "utf8") : "";
            const synced = [];
            for (const [k, v] of Object.entries(payload)) {
              if (!v) continue;
              synced.push(k);
              const reg = new RegExp(`^${k}=.*$`, "m");
              if (reg.test(content)) {
                content = content.replace(reg, `${k}=${v}`);
              } else {
                content = content.trimEnd() + `\n${k}=${v}\n`;
              }
            }
            fs.writeFileSync(".env.local", content.trim() + "\n", { mode: 0o600 });
            console.log("Safely synced environment keys:", synced.join(", "));
          '
          unset ENV_JSON_B64

          node --version
          pnpm --version
          echo "Installing dependencies"
          pnpm install --frozen-lockfile
          echo "Migrating the production database"
          pnpm db:migrate
          echo "Verifying the production database"
          pnpm db:verify
          echo "Syncing AI article summaries"
          pnpm summary:sync
          echo "Building the production bundle"
          pnpm build

          echo "Restarting xdd-blog.service"
          sudo -n systemctl restart xdd-blog.service
          if ! systemctl is-active --quiet xdd-blog.service; then
            echo "xdd-blog.service is not active after restart." >&2
            systemctl status xdd-blog.service --no-pager --full >&2 || true
            exit 1
          fi

          http_code=000
          for attempt in {1..15}; do
            http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:4400/ || true)"
            if [[ "$http_code" == "200" ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$http_code" != "200" ]]; then
            echo "The local health check returned HTTP $http_code; deployment failed." >&2
            exit 1
          fi
          echo "Local health check returned HTTP 200"

          echo "Checking visitor API and WebSocket health"
          visitor_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:4400/api/visitors/stats || true)"
          if [[ "$visitor_code" != "200" ]]; then
            echo "Visitor stats check returned HTTP $visitor_code; deployment failed." >&2
            exit 1
          fi

          ws_check_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            -H "Connection: Upgrade" \
            -H "Upgrade: websocket" \
            -H "Host: 127.0.0.1:4400" \
            -H "Sec-WebSocket-Version: 13" \
            -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            http://127.0.0.1:4400/api/visitors/socket || true)"
          if [[ "$ws_check_code" != "401" ]]; then
            echo "Visitor WebSocket check returned HTTP $ws_check_code (expected 401 Unauthorized); deployment failed." >&2
            exit 1
          fi
          echo "Visitor API and WebSocket health check passed"
          REMOTE
          ) | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash
