name: CI/CD

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 确认发布到生产环境
        type: boolean
        required: true
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: blog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check database migrations
        env:
          DATABASE_URL: file:ci.db
        run: pnpm db:check

      - name: Migrate database
        env:
          DATABASE_URL: file:ci.db
        run: pnpm db:migrate

      - name: Build
        env:
          BETTER_AUTH_URL: http://localhost:4400
          BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-0123456789
          DATABASE_URL: file:ci.db
        run: pnpm build

  publish:
    name: Publish Docker image
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == true }}
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image repository
        id: image
        run: printf 'repository=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == true }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: Deployment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_BLOG_PORT: ${{ vars.DEPLOY_BLOG_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ vars.DATABASE_URL || secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          DATABASE_AUTO_MIGRATE: ${{ vars.DATABASE_AUTO_MIGRATE }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID || secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID || secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          FRIEND_APPLY_NOTIFY_EMAIL: ${{ vars.FRIEND_APPLY_NOTIFY_EMAIL || secrets.FRIEND_APPLY_NOTIFY_EMAIL }}
          AI_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.AI_CREDENTIAL_ENCRYPTION_KEY }}
          PRESENCE_SOURCE_URL: ${{ vars.PRESENCE_SOURCE_URL || secrets.PRESENCE_SOURCE_URL }}
          PRESENCE_READ_MODE: ${{ vars.PRESENCE_READ_MODE }}
          PRESENCE_REPORT_TOKEN_SHA256: ${{ secrets.PRESENCE_REPORT_TOKEN_SHA256 }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_PORT:?}" "${DEPLOY_USER:?}"
          : "${DEPLOY_SSH_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}" "${DEPLOY_IMAGE:?}"
          required_app_keys=(DATABASE_URL BETTER_AUTH_URL BETTER_AUTH_SECRET)
          for key in "${required_app_keys[@]}"; do
            if ! [[ "${!key:-}" =~ [^[:space:]] ]]; then
              printf 'Missing GitHub Deployment value for %s.\n' "$key" >&2
              exit 1
            fi
          done
          if [[ "${DATABASE_URL}" == libsql://* || "${DATABASE_URL}" == *".turso.io"* ]] && ! [[ "${DATABASE_AUTH_TOKEN:-}" =~ [^[:space:]] ]]; then
            printf 'Missing GitHub Deployment value for DATABASE_AUTH_TOKEN.\n' >&2
            exit 1
          fi

          app_env=$(
            for key in "${required_app_keys[@]}" \
              DATABASE_AUTH_TOKEN DATABASE_AUTO_MIGRATE \
              OAUTH_GITHUB_CLIENT_ID OAUTH_GITHUB_CLIENT_SECRET \
              OAUTH_GOOGLE_CLIENT_ID OAUTH_GOOGLE_CLIENT_SECRET \
              ADMIN_EMAIL RESEND_API_KEY RESEND_FROM_EMAIL FRIEND_APPLY_NOTIFY_EMAIL \
              AI_CREDENTIAL_ENCRYPTION_KEY PRESENCE_SOURCE_URL PRESENCE_READ_MODE PRESENCE_REPORT_TOKEN_SHA256; do
              value=${!key:-}
              if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
                printf 'GitHub Deployment value for %s must be a single line.\n' "$key" >&2
                exit 1
              fi
              if [[ -n "$value" ]]; then
                printf '%s=%s\n' "$key" "$value"
              fi
            done
          )

          remote_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f 1)
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            printf 'main has advanced to %s. Run the workflow again for the latest commit.\n' "$remote_sha" >&2
            exit 1
          fi

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/xdd-blog-ssh.XXXXXX")
          trap 'rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" && rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_args=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -i "$ssh_dir/id_ed25519"
            -p "$DEPLOY_PORT"
          )

          {
            printf 'DEPLOY_DIR=%q\n' "${DEPLOY_DIR:-/home/deploy/docker/xdd-blog}"
            printf 'DEPLOY_BLOG_PORT=%q\n' "${DEPLOY_BLOG_PORT:-4400}"
            printf 'DEPLOY_IMAGE=%q\n' "$DEPLOY_IMAGE"
            printf 'DEPLOY_COMPOSE=%q\n' "$(<compose.yaml)"
            printf 'DEPLOY_APP_ENV=%q\n' "$app_env"
            printf 'GHCR_USER=%q\n' "$GITHUB_ACTOR"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat scripts/deploy-docker.sh
          } | ssh "${ssh_args[@]}" -- "$DEPLOY_USER@$DEPLOY_HOST" bash -s
