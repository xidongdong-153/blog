name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: blog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: |
          set -euo pipefail
          printf 'allowBuilds:\n  sharp: true\n  esbuild: true\n' > pnpm-workspace.yaml
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Clean up pnpm build approval file
        if: ${{ always() }}
        run: rm -f pnpm-workspace.yaml

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: Deployment
    steps:
      - name: Prepare SSH files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/xdd-blog-ssh"
          install -d -m 700 "$ssh_dir"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          printf 'SSH_KEY_PATH=%s/id_ed25519\n' "$ssh_dir" >> "$GITHUB_ENV"
          printf 'KNOWN_HOSTS_PATH=%s/known_hosts\n' "$ssh_dir" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRIEND_APPLY_NOTIFY_EMAIL: ${{ vars.FRIEND_APPLY_NOTIFY_EMAIL || secrets.FRIEND_APPLY_NOTIFY_EMAIL }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL || secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID || secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID || secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          ssh_args=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH"
            -i "$SSH_KEY_PATH"
            -p "$DEPLOY_PORT"
          )

          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$TARGET_SHA" "${RESEND_API_KEY:-}" "${FRIEND_APPLY_NOTIFY_EMAIL:-}" "${RESEND_FROM_EMAIL:-}" "${TURSO_DATABASE_URL:-}" "${TURSO_AUTH_TOKEN:-}" "${BETTER_AUTH_URL:-}" "${BETTER_AUTH_SECRET:-}" "${OAUTH_GITHUB_CLIENT_ID:-}" "${OAUTH_GITHUB_CLIENT_SECRET:-}" "${OAUTH_GOOGLE_CLIENT_ID:-}" "${OAUTH_GOOGLE_CLIENT_SECRET:-}" "${ADMIN_EMAIL:-}" <<'REMOTE'
          set -euo pipefail
          target_sha="${1:?missing target SHA}"
          resend_api_key="${2:-}"
          friend_apply_notify_email="${3:-}"
          resend_from_email="${4:-}"
          turso_database_url="${5:-}"
          turso_auth_token="${6:-}"
          better_auth_url="${7:-}"
          better_auth_secret="${8:-}"
          oauth_github_client_id="${9:-}"
          oauth_github_client_secret="${10:-}"
          oauth_google_client_id="${11:-}"
          oauth_google_client_secret="${12:-}"
          admin_email="${13:-}"
          app_dir=/home/deploy/code/xdd/blog

          cd "$app_dir"
          echo "Checking the server worktree"
          worktree_status="$(git status --porcelain --untracked-files=all)"
          old_pnpm_config=$'allowBuilds:\n  sharp: true\n'
          expected_pnpm_config=$'allowBuilds:\n  sharp: true\n  esbuild: true\n'
          if [[ -f pnpm-workspace.yaml ]] && cmp -s pnpm-workspace.yaml <(printf '%s' "$old_pnpm_config"); then
            printf '%s' "$expected_pnpm_config" > pnpm-workspace.yaml
          fi
          pnpm_config_status="$(git status --porcelain --untracked-files=all --ignored -- pnpm-workspace.yaml)"
          if git ls-files --error-unmatch -- pnpm-workspace.yaml >/dev/null 2>&1 ||
            [[ "$pnpm_config_status" != '' && "$pnpm_config_status" != '?? pnpm-workspace.yaml' ]]; then
            echo "pnpm-workspace.yaml must be an untracked server-only file; deployment stopped." >&2
            git status --short --branch >&2
            exit 1
          fi
          if [[ "$pnpm_config_status" == '?? pnpm-workspace.yaml' ]]; then
            if [[ ! -f pnpm-workspace.yaml || -L pnpm-workspace.yaml ]] ||
              ! cmp -s pnpm-workspace.yaml <(printf '%s' "$expected_pnpm_config"); then
              echo "pnpm-workspace.yaml does not exactly match the approved server-only config; deployment stopped." >&2
              git status --short --branch >&2
              exit 1
            fi
            echo "Keeping the approved server-only pnpm config"
          fi
          if [[ -n "$worktree_status" && "$worktree_status" != '?? pnpm-workspace.yaml' ]]; then
            echo "The server worktree has unexpected uncommitted or untracked changes; deployment stopped." >&2
            git status --short --branch >&2
            exit 1
          fi

          if [[ ! -f .env.local ]] ||
            ! git check-ignore -q -- .env.local ||
            git ls-files --error-unmatch -- .env.local >/dev/null 2>&1; then
            echo "Missing or tracked $app_dir/.env.local; deployment stopped without restarting the service." >&2
            exit 1
          fi

          echo "Fetching origin/main"
          git switch main
          git fetch --prune origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$target_sha" ]]; then
            echo "origin/main ($remote_sha) does not match the workflow commit ($target_sha); deployment stopped." >&2
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$current_sha" "$remote_sha"; then
            echo "The server main ($current_sha) is not an ancestor of origin/main ($remote_sha); deployment stopped." >&2
            exit 1
          fi

          echo "Fast-forwarding the server worktree"
          git merge --ff-only origin/main

          echo "Syncing optional environment variables into .env.local"
          sync_env_var() {
            local key="$1"
            local val="$2"
            if [[ -n "$val" ]]; then
              if grep -q "^${key}=" .env.local; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env.local
              else
                printf '\n%s=%s\n' "$key" "$val" >> .env.local
              fi
            fi
          }

          sync_env_var "RESEND_API_KEY" "$resend_api_key"
          sync_env_var "FRIEND_APPLY_NOTIFY_EMAIL" "$friend_apply_notify_email"
          sync_env_var "RESEND_FROM_EMAIL" "$resend_from_email"
          sync_env_var "TURSO_DATABASE_URL" "$turso_database_url"
          sync_env_var "TURSO_AUTH_TOKEN" "$turso_auth_token"
          sync_env_var "BETTER_AUTH_URL" "$better_auth_url"
          sync_env_var "BETTER_AUTH_SECRET" "$better_auth_secret"
          sync_env_var "OAUTH_GITHUB_CLIENT_ID" "$oauth_github_client_id"
          sync_env_var "OAUTH_GITHUB_CLIENT_SECRET" "$oauth_github_client_secret"
          sync_env_var "OAUTH_GOOGLE_CLIENT_ID" "$oauth_google_client_id"
          sync_env_var "OAUTH_GOOGLE_CLIENT_SECRET" "$oauth_google_client_secret"
          sync_env_var "ADMIN_EMAIL" "$admin_email"

          source /home/deploy/.nvm/nvm.sh
          echo "Installing dependencies"
          pnpm install --frozen-lockfile
          echo "Building the production bundle"
          pnpm build

          echo "Restarting xdd-blog.service"
          sudo -n systemctl restart xdd-blog.service
          if ! systemctl is-active --quiet xdd-blog.service; then
            echo "xdd-blog.service is not active after restart." >&2
            systemctl status xdd-blog.service --no-pager --full >&2 || true
            exit 1
          fi

          http_code=000
          for attempt in {1..15}; do
            http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:4400/ || true)"
            if [[ "$http_code" == "200" ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$http_code" != "200" ]]; then
            echo "The local health check returned HTTP $http_code; deployment failed." >&2
            exit 1
          fi
          echo "Local health check returned HTTP 200"
          REMOTE
