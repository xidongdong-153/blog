services:
  blog:
    env_file: !reset []
    environment:
      CI: 'true'
      TURSO_DATABASE_URL: file:/app/data/blog.db
      BETTER_AUTH_URL: http://localhost:${BLOG_PORT:-4400}
      BETTER_AUTH_SECRET: local-docker-only-better-auth-secret-0123456789
    volumes:
      - blog-data:/app/data

volumes:
  blog-data:
